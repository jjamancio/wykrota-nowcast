ur_agua_provavel = 93.0
ur_agua_possivel = 85.0
ur_gelo_provavel = 100.0
ur_gelo_possivel = 90.0
espessura_min_m = 200.0

[transparencia]
desconto_baixa = 3.4
desconto_media = 4.5
desconto_alta = 2.25
fator_possivel = 0.4
pw_mm = [[35.0, 1.1], [45.0, 2.25]]
ur_baixa_media = [90.0, 1.1]

[seeing]
lambda_nm = 500.0
camada_cn2_m = 200.0
L0_m = 10.0
ri_critico = 0.25
