# astro_config.toml — limiares das regras do astro_sounding.py e do goes_nowcast.py
# Notas de transparência e seeing na escala de 1 a 10.
# Tabelas [[limiar, desconto], ...]: aplica o desconto do maior limiar ultrapassado.
# [seeing]: cálculo físico (Cn² de Tatarskii, r0, arcsec) e conversão arcsec → nota.
# [unidades] vento: "km/h", "m/s" ou "kt"; [validade]: horas de validade de cada parte.

[processamento]
bin_m = 100.0
camada_cisalhamento_m = 500.0
p_topo_hpa = 100.0

[nuvens]
